---
# The second cluster of the Argo CD versus Flux comparison (step 6). Same Git server image, a different host port.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30418
        hostPort: 30419
        listenAddress: 127.0.0.1
        protocol: TCP
