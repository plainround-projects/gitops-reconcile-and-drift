---
# The cluster name and node image come from the command line (scripts/cluster-up.sh, versions.env).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# A busy laptop can take longer than kubeadm's default four minutes to start the API server.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      timeoutForControlPlane: 10m0s
nodes:
  - role: control-plane
    extraPortMappings:
      # The Git server's NodePort (platform/git-server), published on the loopback interface only.
      - containerPort: 30418
        hostPort: 30418
        listenAddress: 127.0.0.1
        protocol: TCP
