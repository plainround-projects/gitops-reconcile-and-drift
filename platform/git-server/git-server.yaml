---
apiVersion: v1
kind: Namespace
metadata:
  name: git-server
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
        app.kubernetes.io/name: git-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-server
          image: plainround/git-server:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REPOS
              value: gitops-demo
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repos
              mountPath: /srv/git
            - name: tmp
              mountPath: /tmp
      volumes:
        # Repositories live as long as the pod; `make up` seeds them again after a restart.
        - name: repos
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  selector:
    app: git-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Reaches the server from the host (the runbook pushes through this port).
apiVersion: v1
kind: Service
metadata:
  name: git-server-host
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  type: NodePort
  selector:
    app: git-server
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30418
